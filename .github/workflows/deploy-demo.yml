name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "qr-hover-demo/**"   # only re-deploy when the demo changes
      - ".github/workflows/deploy-demo.yml"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qr-hover-demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: qr-hover-demo

      - name: Build
        run: npm run build
        working-directory: qr-hover-demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: qr-hover-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
